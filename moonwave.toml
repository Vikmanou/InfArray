# Custom landing page: a hero built from the README plus feature cards.
[home]
enabled = true
includeReadme = true

[[home.features]]
title = "Beyond 2^26"
description = "Chunks values past Luau's per-table size cap, so one logical array scales to 2^53 elements."

[[home.features]]
title = "Hole-safe by design"
description = "Removals leave nil holes and per-chunk lengths are tracked explicitly."

[[home.features]]
title = "Built for bulk"
description = "IterateChunks hands you raw chunks with their base offset and length for maximum throughput."

